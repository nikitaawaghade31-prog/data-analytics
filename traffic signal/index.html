<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic signal</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: lightgray;
        }
        .traffic-signal{
            width: 180px;
            height: 420px;
            background-color: black;
            border: 5px solid black;
            border-radius: 25px;
            padding: 20px;
            box-sizing: border-box;

         }
          
         .light{
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 15px auto;
            border: 3px solid gray;
        }

        .red{
            background-color: red;
            box-shadow: 0 0 20px red;

        }

        .yellow{
            background-color: yellow;
            box-shadow: 0 0 20px yellow;
        
        }

        .green{
            background-color: green;
            box-shadow: 0 0 20px green;
        }

        .stand{
            width: 30px;
            height: 100px;
            background-color: black;
            margin: auto;

        }

        .base{
            width: 150px;
            height: 20px;
            background-color: black;
            border-radius: 10px;
            margin: auto;
        }
        
        

        .circle{
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin: 20px auto;
        }

    </style>
</head>
<body>
    <div>

    <div class="traffic-signal">
        <div class=" light red"></div>

        <div class="light yellow"></div>

        <div class="light green"></div>
    </div>

    <div class="stand"></div>

    <div class="base"></div>

    </div>
    
</body>
</html>
